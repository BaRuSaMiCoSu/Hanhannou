<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>酸化還元 半反応式テスト</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#1a2233;
    --ink-sub:#5b6779;
    --line:#e2e7f0;
    --accent:#2f6df6;
    --accent-ink:#ffffff;
    --ox:#d9483b;
    --ox-bg:#fdecea;
    --red:#1f7a53;
    --red-bg:#e7f6ee;
    --note:#8a5a00;
    --note-bg:#fff5da;
    --ok:#1f7a53;
    --ng:#d9483b;
    --shadow:0 2px 10px rgba(20,30,60,.07);
    --r:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1626;
      --card:#182238;
      --ink:#eef2fb;
      --ink-sub:#9dabc2;
      --line:#2b3752;
      --accent:#5b8dff;
      --ox:#ff8f84;
      --ox-bg:#3a1f1c;
      --red:#6fd6a4;
      --red-bg:#12332a;
      --note:#ffd479;
      --note-bg:#3a2f14;
      --ok:#3fae7c;
      --ng:#e2665a;
      --shadow:0 2px 10px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:560px;
    margin:0 auto;
    padding:0 14px calc(20px + env(safe-area-inset-bottom));
    min-height:100dvh;
  }
  .hidden{display:none !important}

  h1{font-size:20px;margin:18px 0 4px;letter-spacing:.02em}
  .lead{color:var(--ink-sub);font-size:13px;margin:0 0 18px}

  .block{margin-bottom:22px}
  .block > .label{
    font-size:13px;font-weight:700;color:var(--ink-sub);
    margin:0 0 8px;letter-spacing:.06em;
  }

  .opts{display:grid;gap:8px}
  .opt{
    display:block;width:100%;text-align:left;
    background:var(--card);color:var(--ink);
    border:2px solid var(--line);border-radius:var(--r);
    padding:14px 16px;min-height:58px;
    font:inherit;font-size:16px;font-weight:600;
    cursor:pointer;transition:border-color .12s,background .12s;
  }
  .opt small{display:block;font-weight:400;font-size:12px;color:var(--ink-sub);margin-top:2px}
  .opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
  .opt.on small{color:var(--ink-sub)}
  .opt.mode-opt{display:flex;align-items:center;gap:12px}
  .otxt{flex:1;min-width:0}
  .cnt{
    flex:none;font-size:12px;font-weight:700;color:var(--ink-sub);
    background:var(--bg);border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;font-variant-numeric:tabular-nums;
  }
  .opt.on .cnt{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
  .opts.row{grid-template-columns:repeat(3,1fr);gap:8px}
  .block.off{opacity:.4}
  .block.off .opts{pointer-events:none}
  .opts.row .opt{text-align:center;font-size:15px;padding:14px 6px}

  .btn{
    display:block;width:100%;border:none;border-radius:var(--r);
    padding:16px;min-height:60px;
    font:inherit;font-size:17px;font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
  .btn-ok{background:var(--ok);color:#fff}
  .btn-ng{background:var(--ng);color:#fff}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .nums .btn{padding:12px 2px;min-height:54px;font-size:16px;font-variant-numeric:tabular-nums}

  /* ---- quiz header ---- */
  .topbar{
    position:sticky;top:0;z-index:5;
    background:var(--bg);
    padding:12px 0 10px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .stats{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-sub)}
  .stats .grow{flex:1}
  .stats b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
  .quit{
    background:none;border:1px solid var(--line);color:var(--ink-sub);
    border-radius:999px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;
  }
  .bar{height:6px;border-radius:999px;background:var(--line);margin-top:9px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .25s}

  /* ---- question card ---- */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:20px 18px;margin-bottom:14px;
  }
  .qlabel{font-size:12px;font-weight:700;color:var(--ink-sub);letter-spacing:.08em;margin-bottom:12px}
  .qmain{font-size:26px;font-weight:700;line-height:1.45;word-break:break-word}
  .formula{font-size:27px;font-weight:700;letter-spacing:.02em;line-height:1.5;word-break:break-all}
  .formula sub,.formula sup,.qmain sub,.qmain sup{font-size:.62em;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{
    font-size:13px;font-weight:700;border-radius:999px;padding:4px 11px;
    background:var(--note-bg);color:var(--note);border:1px solid color-mix(in srgb,var(--note) 25%,transparent);
  }
  .chip.ox{background:var(--ox-bg);color:var(--ox);border-color:color-mix(in srgb,var(--ox) 25%,transparent)}
  .chip.rd{background:var(--red-bg);color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent)}
  .chip.atom{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-size:14px}
  .again{
    display:inline-block;margin-top:12px;font-size:12px;font-weight:700;
    color:var(--ng);background:var(--ox-bg);border-radius:999px;padding:3px 10px;
  }
  .adiv{border-top:1px dashed var(--line);margin:16px 0 14px}
  .alabel{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;margin-bottom:8px}
  .verdict{font-size:14px;font-weight:700;margin-bottom:10px}
  .verdict.ok{color:var(--ok)}
  .verdict.ng{color:var(--ng)}
  .ask{font-size:13px;color:var(--ink-sub);text-align:center;margin:0 0 10px}
  .note{
    margin:14px 0 0;padding:10px 12px;
    background:var(--bg);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
    font-size:12.5px;line-height:1.75;color:var(--ink-sub);
  }
  .note sub,.note sup{font-size:.72em;font-weight:700}

  /* ---- result ---- */
  .sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .tile span{display:block;font-size:12px;color:var(--ink-sub)}
  .tile strong{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
  .miss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
  .miss .mname{font-weight:700;font-size:15px}
  .miss .mform{font-size:19px;font-weight:700;margin-top:6px;word-break:break-all}
  .miss .mform sub,.miss .mform sup{font-size:.62em}
  .miss .mname sub,.miss .mname sup{font-size:.72em}
  .miss .mcnt{font-size:12px;color:var(--ng);font-weight:700;margin-top:6px}
  .perfect{text-align:center;padding:22px;color:var(--ok);font-weight:700}
  .foot{margin-top:20px;display:grid;gap:10px}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 設定画面 ============ -->
  <section id="setup">
    <h1>酸化還元 半反応式テスト</h1>
    <p class="lead">自己採点式。間違えた問題は正解するまで繰り返し出題されます。</p>

    <div class="block">
      <p class="label">出題形式</p>
      <div class="opts" id="modeOpts">
        <button class="opt mode-opt on" data-v="n2c"><span class="otxt">名称 → 変化<small>例：過マンガン酸イオン（酸性条件下） → MnO₄⁻ → Mn²⁺</small></span><span class="cnt">–</span></button>
        <button class="opt mode-opt" data-v="c2n"><span class="otxt">変化 → 名称<small>式を見て物質名を答える</small></span><span class="cnt">–</span></button>
        <button class="opt mode-opt" data-v="role"><span class="otxt">酸化剤／還元剤の判別<small>名称を見てどちらかを選ぶ</small></span><span class="cnt">–</span></button>
        <button class="opt mode-opt" data-v="oxnum"><span class="otxt">酸化数を答える<small>化合物中の指定原子の酸化数を選ぶ</small></span><span class="cnt">–</span></button>
      </div>
    </div>

    <div class="block">
      <p class="label">難易度</p>
      <div class="opts row" id="levelOpts">
        <button class="opt" data-v="基礎">基礎</button>
        <button class="opt" data-v="入試">入試</button>
        <button class="opt on" data-v="all">全部</button>
      </div>
    </div>

    <div class="block" id="rangeBlock">
      <p class="label">出題範囲</p>
      <div class="opts row" id="rangeOpts">
        <button class="opt" data-v="ox">酸化剤のみ</button>
        <button class="opt" data-v="rd">還元剤のみ</button>
        <button class="opt on" data-v="all">全部</button>
      </div>
    </div>

    <p class="lead" id="rangeInfo" style="margin:-10px 0 14px"></p>
    <button class="btn btn-primary" id="startBtn">開始する</button>
  </section>

  <!-- ============ 出題画面 ============ -->
  <section id="quiz" class="hidden">
    <div class="topbar">
      <div class="stats">
        <span>残り <b id="stRemain">0</b></span>
        <span>正答率 <b id="stRate">–</b></span>
        <span class="grow"></span>
        <button class="quit" id="quitBtn">終了</button>
      </div>
      <div class="bar"><i id="stBar"></i></div>
    </div>

    <div class="card">
      <p class="qlabel" id="qLabel">問題</p>
      <div id="qBody"></div>
      <div id="answerArea" class="hidden">
        <div class="adiv"></div>
        <p class="alabel" id="aLabel">答え</p>
        <div id="aBody"></div>
      </div>
    </div>

    <div id="actArea"></div>
  </section>

  <!-- ============ 結果画面 ============ -->
  <section id="result" class="hidden">
    <h1>結果</h1>
    <p class="lead" id="rsLead"></p>
    <div class="sumgrid">
      <div class="tile"><span>出題した問題</span><strong id="rsTotal">0</strong></div>
      <div class="tile"><span>解答した回数</span><strong id="rsAnswered">0</strong></div>
      <div class="tile"><span>正答率</span><strong id="rsRate">0%</strong></div>
      <div class="tile"><span>一発正解</span><strong id="rsPerfect">0</strong></div>
    </div>
    <p class="label" style="font-size:13px;font-weight:700;color:var(--ink-sub);letter-spacing:.06em">間違えた問題</p>
    <div id="rsMiss"></div>
    <div class="foot">
      <button class="btn btn-primary" id="retryMissBtn">間違えた問題だけもう一度</button>
      <button class="btn btn-ghost" id="retryAllBtn">同じ条件でもう一度</button>
      <button class="btn btn-ghost" id="backBtn">設定に戻る</button>
    </div>
  </section>

</div>

<script src="questions.js"></script>
<script>
"use strict";
// 問題データ（OXIDIZERS / REDUCERS / ITEMS）は questions.js で定義

const ROLE_LABEL = { ox:"酸化剤", rd:"還元剤" };

/* 酸化数の選択肢。−4〜+7 に加え、S4O6^2- の +2.5 と Fe3O4 の +8/3 を用意する */
const OXNUM_CHOICES = ["-4","-3","-2","-1","0","+1","+2","+2.5","+8/3","+3","+4","+5","+6","+7"];
const numLabel = v => v.replace("-", "\u2212");

/* =========================================================
   表示ユーティリティ
   ========================================================= */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/**
 * "MnO4^- → Mn^2+" を <sub>/<sup> 付きHTMLへ。
 *  ^ の直後の電荷（例 ^2-, ^-, ^3+）→ <sup>
 *  元素記号や ")" の直後の数字      → <sub>（先頭の係数は対象外）
 */
function chem(src){
  let s = esc(src);
  s = s.replace(/\^([0-9]*[+-])/g, (_, c) => "<sup>" + c.replace("-", "\u2212") + "</sup>");
  s = s.replace(/([A-Za-z)])([0-9]+)/g, (_, a, d) => a + "<sub>" + d + "</sub>");
  return s;
}

/** 名称を「本体」と「（但し書き）」に分解 */
function splitName(name){
  const notes = [];
  const base = name.replace(/（([^）]*)）/g, (_, n) => { notes.push(n); return ""; }).trim();
  return { base, notes };
}

/** 名称HTML（但し書きはチップとして必ず表示） */
function nameHTML(item, opts){
  const showRole = opts && opts.role;
  const { base, notes } = splitName(item.name);
  let html = '<div class="qmain">' + esc(base) + "</div>";
  const chips = [];
  if (showRole) chips.push('<span class="chip ' + item.role + '">' + ROLE_LABEL[item.role] + "</span>");
  notes.forEach(n => chips.push('<span class="chip">' + esc(n) + "</span>"));
  if (chips.length) html += '<div class="chips">' + chips.join("") + "</div>";
  return html;
}

/** 酸化数モードの問題（化学式＋対象原子） */
function oxnumHTML(item){
  return '<div class="formula">' + chem(item.f) + "</div>" +
         '<div class="chips"><span class="chip atom">' + esc(item.atom) + " の酸化数</span></div>";
}

/** 解説（note）。化学式は下付き・上付きに変換して表示する */
function noteHTML(item){
  return item.note ? '<p class="note">' + chem(item.note) + "</p>" : "";
}

function changeHTML(item, opts){
  const showRole = opts && opts.role;
  let html = '<div class="formula">' + chem(item.change) + "</div>";
  if (showRole) html += '<div class="chips"><span class="chip ' + item.role + '">' + ROLE_LABEL[item.role] + "</span></div>";
  return html;
}

/* =========================================================
   状態
   ========================================================= */
const MODE_TEXT = {
  n2c:  { q:"この物質の変化は？",       a:"半反応式の変化" },
  c2n:  { q:"この変化をする物質は？",   a:"物質の名称" },
  role: { q:"酸化剤・還元剤どちら？",   a:"" },
  oxnum:{ q:"指定した原子の酸化数は？", a:"" }
};

/** 半反応式を使うモードか（酸化数モードだけ別の問題プールを使う） */
const usesHalf = mode => mode !== "oxnum";

let cfg = { mode:"n2c", range:"all", level:"all" };
let S = null;
let lastMissed = [];   // 結果画面の「間違えた問題だけもう一度」用

const $ = id => document.getElementById(id);

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function poolFor(mode, range, level){
  if (mode === "oxnum") return OXNUM.filter(q => level === "all" || q.level === level);
  return pickItems(range, level);
}

function pickItems(range, level){
  return ITEMS.filter(i =>
    (range === "all" || i.role === range) &&
    (level === "all" || i.level === level));
}

function startSession(items){
  S = {
    mode: cfg.mode,
    items: items,
    queue: shuffle(items.slice()),
    answered: 0,
    correct: 0,
    wrong: new Map(items.map(i => [i.id, 0])),
    revealed: false,
    judged: null,
    startedAt: Date.now(),
    timer: null
  };
  show("quiz");
  render();
}

function show(which){
  ["setup","quiz","result"].forEach(id => $(id).classList.toggle("hidden", id !== which));
  window.scrollTo(0, 0);
}

/* =========================================================
   出題描画
   ========================================================= */
function render(){
  if (S.timer){ clearTimeout(S.timer); S.timer = null; }

  if (S.queue.length === 0){ finish(); return; }
  const item = S.queue[0];
  const t = MODE_TEXT[S.mode];

  // 進捗
  const mastered = S.items.length - new Set(S.queue.map(i => i.id)).size;
  $("stRemain").textContent = S.items.length - mastered;
  $("stRate").textContent = S.answered ? Math.round(S.correct / S.answered * 100) + "%" : "–";
  $("stBar").style.width = (mastered / S.items.length * 100) + "%";

  // 問題文
  $("qLabel").textContent = t.q;
  let q = (S.mode === "oxnum") ? oxnumHTML(item)
        : (S.mode === "c2n")      ? changeHTML(item)
        :                           nameHTML(item);
  if (S.wrong.get(item.id) > 0) q += '<span class="again">復習 ' + S.wrong.get(item.id) + " 回ミス</span>";
  $("qBody").innerHTML = q;

  // 答え欄・操作欄
  $("answerArea").classList.add("hidden");
  $("aLabel").textContent = t.a;
  $("aLabel").classList.toggle("hidden", !t.a);
  $("aBody").innerHTML = "";
  S.revealed = false;
  S.judged = null;

  if (S.mode === "role"){
    $("actArea").innerHTML =
      '<p class="ask">どちらか選んでください</p>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" data-act="pick" data-v="ox">酸化剤</button>' +
        '<button class="btn btn-ghost" data-act="pick" data-v="rd">還元剤</button>' +
      "</div>";
  } else if (S.mode === "oxnum"){
    $("actArea").innerHTML =
      '<p class="ask">酸化数を選んでください</p>' +
      '<div class="nums">' +
        OXNUM_CHOICES.map(v =>
          '<button class="btn btn-ghost" data-act="picknum" data-v="' + v + '">' + numLabel(v) + "</button>"
        ).join("") +
      "</div>";
  } else {
    $("actArea").innerHTML = '<button class="btn btn-primary" data-act="reveal">答えを見る</button>';
  }
}

function reveal(){
  if (S.revealed) return;
  const item = S.queue[0];
  S.revealed = true;
  $("aBody").innerHTML = ((S.mode === "c2n")
    ? nameHTML(item, { role:true })
    : changeHTML(item, { role:true })) + noteHTML(item);
  $("answerArea").classList.remove("hidden");
  $("actArea").innerHTML =
    '<p class="ask">自己採点してください</p>' +
    '<div class="btn-row">' +
      '<button class="btn btn-ok" data-act="judge" data-v="1">正解</button>' +
      '<button class="btn btn-ng" data-act="judge" data-v="0">不正解</button>' +
    "</div>";
}

function pickRole(v){
  if (S.judged !== null) return;
  const item = S.queue[0];
  const ok = (v === item.role);
  S.judged = ok;

  $("aBody").innerHTML =
    '<p class="verdict ' + (ok ? "ok" : "ng") + '">' +
      (ok ? "○ 正解" : "× 不正解（正解は「" + ROLE_LABEL[item.role] + "」）") +
    "</p>" +
    changeHTML(item, { role:true }) + noteHTML(item);
  $("answerArea").classList.remove("hidden");

  if (ok){
    $("actArea").innerHTML = '<button class="btn btn-ghost" data-act="judge" data-v="1">次へ</button>';
    S.timer = setTimeout(() => judge(true), 800);
  } else {
    $("actArea").innerHTML = '<button class="btn btn-primary" data-act="judge" data-v="0">次へ</button>';
  }
}

function pickNum(v){
  if (S.judged !== null) return;
  const item = S.queue[0];
  const ok = (v === item.ans);
  S.judged = ok;

  $("aBody").innerHTML =
    '<p class="verdict ' + (ok ? "ok" : "ng") + '">' +
      (ok ? "○ 正解" : "× 不正解（あなたの答え " + numLabel(v) + "）") +
    "</p>" +
    '<div class="qmain">' + esc(item.atom) + " = " + numLabel(item.ans) + "</div>" +
    noteHTML(item);
  $("answerArea").classList.remove("hidden");

  if (ok){
    $("actArea").innerHTML = '<button class="btn btn-ghost" data-act="judge" data-v="1">次へ</button>';
    S.timer = setTimeout(() => judge(true), 800);
  } else {
    $("actArea").innerHTML = '<button class="btn btn-primary" data-act="judge" data-v="0">次へ</button>';
  }
}

function judge(ok){
  if (S.timer){ clearTimeout(S.timer); S.timer = null; }
  const item = S.queue.shift();
  S.answered++;
  if (ok){
    S.correct++;
  } else {
    S.wrong.set(item.id, S.wrong.get(item.id) + 1);
    // 少し先へ差し込んで再出題（正解するまで消えない）
    const min = Math.min(2, S.queue.length);
    const idx = min + Math.floor(Math.random() * (S.queue.length - min + 1));
    S.queue.splice(idx, 0, item);
  }
  render();
}

/* =========================================================
   結果
   ========================================================= */
function finish(){
  if (S.timer){ clearTimeout(S.timer); S.timer = null; }
  const missed = S.items
    .filter(i => S.wrong.get(i.id) > 0)
    .sort((a, b) => S.wrong.get(b.id) - S.wrong.get(a.id));
  const perfect = S.items.length - missed.length;
  const sec = Math.round((Date.now() - S.startedAt) / 1000);
  const mm = Math.floor(sec / 60), ss = sec % 60;

  const roles = new Set(S.items.map(i => i.role));
  const scope = !usesHalf(S.mode) ? S.items.length + "問"
    : (S.items.length === ITEMS.length) ? "全部"
    : (roles.size === 1 ? ROLE_LABEL[[...roles][0]] + "のみ" : S.items.length + "問");
  $("rsLead").textContent =
    MODE_TEXT[S.mode].q + "（" + scope + "）／ 所要 " + mm + "分" + ss + "秒";
  $("rsTotal").textContent = S.items.length;
  $("rsAnswered").textContent = S.answered;
  $("rsRate").textContent = S.answered ? Math.round(S.correct / S.answered * 100) + "%" : "–";
  $("rsPerfect").textContent = perfect + " / " + S.items.length;

  const missCard = i =>
    '<div class="miss">' +
      (usesHalf(S.mode)
        ? '<div class="mname">' + esc(i.name) + ' <span class="chip ' + i.role + '">' + ROLE_LABEL[i.role] + "</span></div>" +
          '<div class="mform">' + chem(i.change) + "</div>"
        : '<div class="mname">' + chem(i.f) + " の " + esc(i.atom) + "</div>" +
          '<div class="mform">' + numLabel(i.ans) + "</div>") +
      '<div class="mcnt">' + S.wrong.get(i.id) + " 回ミス</div>" +
    "</div>";

  $("rsMiss").innerHTML = missed.length
    ? missed.map(missCard).join("")
    : '<div class="perfect">全問ノーミス！ 🎉</div>';

  $("retryMissBtn").classList.toggle("hidden", missed.length === 0);
  lastMissed = missed;
  show("result");
}

/* =========================================================
   イベント
   ========================================================= */
function bindOpts(wrapId, key){
  $(wrapId).addEventListener("click", e => {
    const b = e.target.closest(".opt");
    if (!b) return;
    [...$(wrapId).querySelectorAll(".opt")].forEach(x => x.classList.toggle("on", x === b));
    cfg[key] = b.dataset.v;
    updateSetup();
  });
}
bindOpts("modeOpts", "mode");
bindOpts("levelOpts", "level");
bindOpts("rangeOpts", "range");

function updateSetup(){
  [...document.querySelectorAll("#modeOpts .opt")].forEach(b => {
    b.querySelector(".cnt").textContent =
      poolFor(b.dataset.v, cfg.range, cfg.level).length + "問";
  });

  // 酸化数モードは酸化剤・還元剤の区別がないので出題範囲を使わない
  $("rangeBlock").classList.toggle("off", !usesHalf(cfg.mode));

  const n = poolFor(cfg.mode, cfg.range, cfg.level).length;
  let msg;
  if (n === 0){
    msg = "この難易度には出題できる問題がありません。難易度を変えてください。";
  } else {
    msg = n + " 問を出題します。";
    if (!usesHalf(cfg.mode)) msg += "（酸化数モードでは出題範囲の指定は使いません）";
    else if (cfg.mode === "role" && cfg.range !== "all") msg += "（判別モードは範囲を絞ると答えが一択になります）";
  }
  $("rangeInfo").textContent = msg;
  $("startBtn").disabled = (n === 0);
}
updateSetup();

$("startBtn").addEventListener("click", () => startSession(poolFor(cfg.mode, cfg.range, cfg.level)));

$("actArea").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  if (b.dataset.act === "reveal") reveal();
  else if (b.dataset.act === "pick") pickRole(b.dataset.v);
  else if (b.dataset.act === "picknum") pickNum(b.dataset.v);
  else if (b.dataset.act === "judge") judge(b.dataset.v === "1");
});

$("quitBtn").addEventListener("click", () => {
  if (S.answered === 0 || confirm("テストを終了して結果を表示しますか？")) finish();
});

$("retryAllBtn").addEventListener("click", () => startSession(S.items.slice()));
$("retryMissBtn").addEventListener("click", () => {
  if (lastMissed.length) startSession(lastMissed.slice());
});
$("backBtn").addEventListener("click", () => show("setup"));

// PC でも軽く操作できるように
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  if (e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if (!S.revealed && S.mode !== "role" && S.mode !== "oxnum") reveal();
  } else if (S.revealed && (e.key === "1" || e.key === "o")) judge(true);
  else if (S.revealed && (e.key === "2" || e.key === "x")) judge(false);
});
</script>
